# CI for Kalapriti Designs.
#
# Pull requests: lint + build + verify the output. Nothing is published.
# Push to main:  the same checks, then upload the build to Hostinger over FTPS.
#
# The site is served from public_html on Hostinger shared hosting at
# kalapritidesigns.com. Repo visibility is irrelevant to hosting — only the
# built files are transferred.
#
# REQUIRED SECRETS (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    hostname from hPanel -> Files -> FTP Accounts (e.g. ftp.kalapritidesigns.com)
#   FTP_USERNAME  FTP account username
#   FTP_PASSWORD  FTP account password
#
# Credentials live only in GitHub Secrets; they are never written into the repo.

name: build-and-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Guards for the failures that have actually bitten this project before:
      # a wrong base path shipping subpath-prefixed URLs, and .htaccess being
      # dropped from the build (which would silently break every deep link).
      - name: Verify build output
        run: |
          set -e
          if grep -q 'src="/kalapriti/assets/' dist/index.html; then
            echo "::error::dist/index.html still references the /kalapriti/ subpath — Vite base is wrong."
            exit 1
          fi
          grep -q 'src="/assets/' dist/index.html \
            || { echo "::error::dist/index.html has no root-relative asset URLs."; exit 1; }
          test -f dist/.htaccess \
            || { echo "::error::dist/.htaccess missing — deep links would 404 on Apache."; exit 1; }
          grep -q 'RewriteRule ^ index.html' dist/.htaccess \
            || { echo "::error::.htaccess has no SPA fallback rule."; exit 1; }
          echo "build output OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Deploy to Hostinger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
          # Only changed files are transferred; the action keeps a manifest on
          # the server so a normal deploy moves kilobytes, not the whole build.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
