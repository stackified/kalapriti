<!doctype html>

    />

    <!-- LCP image: preload the AVIF the hero will pick, so it starts
         downloading with the HTML rather than after React mounts. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/assets/img/hero-640.avif 640w, /assets/img/hero-1280.avif 1280w"

    <link rel="icon" type="image/svg+xml" href="/assets/logo/logo-mark.svg" />

      }
    </script>

    <!--
      GitHub Pages SPA support.
      Pages has no server-side rewrite, so a deep link like /services
      is served 404.html. That file encodes the path into a query string and
      redirects here; this script restores the real URL before React mounts.
      Remove both once the site moves to a host with proper SPA rewrites.
    -->
    <script>
      (function () {
        var q = window.location.search
        if (q.indexOf('?/') === 0) {
          var decoded = q
            .slice(2)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          window.history.replaceState(
            null,
            null,
            window.location.pathname.replace(/\/$/, '') + '/' + decoded + window.location.hash
          )
        }
      })()
    </script>
