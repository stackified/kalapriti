<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kalapriti Associates</title>
    <script>
      /*
        GitHub Pages SPA fallback.

        Pages serves this file for any path it cannot find on disk. We encode
        the requested path into a query string and bounce to the app's index,
        where a matching snippet in index.html restores the real URL and lets
        React Router take over.

        pathSegmentsToKeep = 1 because the site is served from a project
        subpath (/kalapriti/). Set it to 0 after moving to a custom domain.
      */
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
